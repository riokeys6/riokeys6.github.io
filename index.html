<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Urban Goggles — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #1a1e24;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
    }

    .card {
      width: 100%; max-width: 380px;
      background: #2a2f37;
      border: 1px solid #363c45;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      font-family: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      font-weight: 800; font-size: 2rem; letter-spacing: .02em;
      color: #f1f5f9; text-align: center;
      margin: 0 0 .35rem;
    }
    .logo span { color: #e3a72f; }

    .subtitle {
      text-align: center; color: #64748b;
      font-size: .9rem; margin: 0 0 2rem;
    }

    label {
      display: block; font-size: .85rem; font-weight: 600;
      color: #94a3b8; margin-bottom: .45rem; letter-spacing: .04em;
      text-transform: uppercase;
    }

    .input-wrap { position: relative; margin-bottom: 1.25rem; }
    input[type="password"] {
      width: 100%; font: inherit; font-size: 1rem;
      background: #1a1e24; color: #f1f5f9;
      border: 1.5px solid #363c45; border-radius: 8px;
      padding: .75rem 3rem .75rem 1rem;
      outline: none; transition: border-color .15s;
      letter-spacing: .1em;
    }
    input[type="password"]:focus { border-color: #e3a72f; }
    input[type="password"]::placeholder { color: #3d444d; letter-spacing: 0; }

    .toggle-pw {
      position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 0;
      color: #64748b; font-size: 1.1rem; line-height: 1;
      transition: color .15s;
    }
    .toggle-pw:hover { color: #e3a72f; }

    .error {
      display: none; background: rgba(166,58,43,.18);
      border: 1px solid rgba(166,58,43,.4); border-radius: 7px;
      color: #f87171; font-size: .88rem;
      padding: .65rem .9rem; margin-bottom: 1.1rem; text-align: center;
    }
    .error.show { display: block; animation: shake .3s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
    }

    .btn-login {
      width: 100%; font: inherit; font-weight: 700; font-size: 1rem;
      background: #433b3e; color: #fff;
      border: none; border-radius: 8px;
      padding: .8rem; cursor: pointer;
      box-shadow: 0 2px 8px rgba(67,59,62,.4);
      transition: filter .15s, transform .1s;
      letter-spacing: .02em;
    }
    .btn-login:hover { filter: brightness(1.2); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login.loading { opacity: .6; pointer-events: none; }

    footer {
      margin-top: 2rem; color: #3d444d;
      font-size: .82rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Urban<span>Goggles</span></p>
    <p class="subtitle">Enter your password to continue</p>

    <div id="error" class="error">Incorrect password. Try again.</div>

    <label for="pw">Password</label>
    <div class="input-wrap">
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus />
      <button class="toggle-pw" type="button" id="toggle-pw" aria-label="Show password">👁</button>
    </div>

    <button class="btn-login" id="login-btn">Login</button>
  </div>

  <footer>Urban Goggles · private</footer>

  <script>
    var pw     = document.getElementById('pw');
    var btn    = document.getElementById('login-btn');
    var err    = document.getElementById('error');
    var toggle = document.getElementById('toggle-pw');

    toggle.addEventListener('click', function () {
      var shown = pw.type === 'text';
      pw.type = shown ? 'password' : 'text';
      toggle.textContent = shown ? '👁' : '🙈';
    });

    function attempt() {
      err.classList.remove('show');
      if (pw.value === 'alpine') {
        sessionStorage.setItem('ug_auth', '1');
        btn.textContent = 'Entering…';
        btn.classList.add('loading');
        setTimeout(function () {
          window.location.href = 'index.html';
        }, 400);
      } else {
        err.classList.add('show');
        pw.value = '';
        pw.focus();
      }
    }

    btn.addEventListener('click', attempt);
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
  </script>
</body>
</html>
